<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}{{ brand }}{% endblock %}</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  {% block head %}{% endblock %}
</head>
<body data-page="{% block page_name %}shop{% endblock %}">
  <svg class="svg-defs" width="0" height="0" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="vdx-grad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/>
        <stop offset=".5" stop-color="#b9a3ff"/>
        <stop offset="1" stop-color="#48e0ff"/>
      </linearGradient>
      <linearGradient id="vdx-grad-gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff1b8"/>
        <stop offset="1" stop-color="#ffc93c"/>
      </linearGradient>
    </defs>
  </svg>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
    <span class="orb orb-c"></span>
    <span class="grid-haze"></span>
  </div>
  {% block body %}{% endblock %}
  {% block boot %}{% endblock %}
  <script src="/static/app.js" defer></script>
</body>
</html>
